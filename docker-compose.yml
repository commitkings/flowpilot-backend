services:
  # ── Migrator ───────────────────────────────────────────────────────────────
  # One-shot service: runs Alembic migrations then exits.
  # All services that use the DB depend on this completing successfully.
  migrator:
    build: .
    env_file: .env
    command: >
      sh -c "
        alembic upgrade head &&
        python scripts/seed_institutions.py &&
        python scripts/seed_kyc_limits.py
      "
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:oracle@db:5432/flowpilot
    restart: "no"

  # ── API Service ────────────────────────────────────────────────────────────
  # Handles all HTTP requests. Lightweight — no background loops or agent work.
  gateway:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    command: uvicorn app.gateway_service:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      core-api:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      wallet-service:
        condition: service_healthy
      kyc-service:
        condition: service_healthy
      orchestration-service:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:oracle@db:5432/flowpilot
      - REDIS_URL=redis://redis:6379/0
      - SERVICE_ROLE=gateway
      - CORE_API_URL=http://core-api:8500
      - PAYMENT_SERVICE_URL=http://payment-service:8100
      - WALLET_SERVICE_URL=http://wallet-service:8200
      - KYC_SERVICE_URL=http://kyc-service:8300
      - ORCHESTRATION_SERVICE_URL=http://orchestration-service:8400
    restart: unless-stopped

  core-api:
    build: .
    env_file: .env
    command: uvicorn app.api.app:app --host 0.0.0.0 --port 8500
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://postgres:oracle@db:5432/flowpilot
      - REDIS_URL=redis://redis:6379/0
      - SERVICE_ROLE=core_api
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8500/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # ── Worker Service ─────────────────────────────────────────────────────────
  # Runs all scheduled background tasks (cron loops, reminders, webhook health,
  # API key expiry checks). Uses ARQ/Celery over Redis.
  # Scale independently from the API when task volume grows.
  worker:
    build: .
    env_file: .env
    command: python -m app.worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://postgres:oracle@db:5432/flowpilot
      - REDIS_URL=redis://redis:6379/0
      - SERVICE_ROLE=worker
    restart: unless-stopped

  # ── Agent Worker ───────────────────────────────────────────────────────────
  # Runs the AI agent pipeline (plan → reconcile → risk-score → execute).
  # Can be scaled horizontally: run multiple replicas to handle concurrent
  # payout runs without impacting API latency.
  agent-worker:
    build: .
    env_file: .env
    command: python -m app.agent_worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://postgres:oracle@db:5432/flowpilot
      - REDIS_URL=redis://redis:6379/0
      - SERVICE_ROLE=agent_worker
    restart: unless-stopped

  # ── Payment Service (Monnify) ──────────────────────────────────────────────
  # Dedicated service for payment provider integration.
  # Isolated so provider-specific failures do not affect other services.
  payment-service:
    build: .
    env_file: .env
    command: uvicorn app.payment_service:app --host 0.0.0.0 --port 8100
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://postgres:oracle@db:5432/flowpilot
      - REDIS_URL=redis://redis:6379/0
      - SERVICE_ROLE=payment_service
      - MONNIFY_API_KEY=${MONNIFY_API_KEY}
      - MONNIFY_SECRET_KEY=${MONNIFY_SECRET_KEY}
      - MONNIFY_CONTRACT_CODE=${MONNIFY_CONTRACT_CODE}
      - MONNIFY_BASE_URL=${MONNIFY_BASE_URL:-https://api.monnify.com}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8100/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  wallet-service:
    build: .
    env_file: .env
    command: uvicorn app.wallet_service:app --host 0.0.0.0 --port 8200
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://postgres:oracle@db:5432/flowpilot
      - REDIS_URL=redis://redis:6379/0
      - SERVICE_ROLE=wallet_service
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8200/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  kyc-service:
    build: .
    env_file: .env
    command: uvicorn app.kyc_service:app --host 0.0.0.0 --port 8300
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://postgres:oracle@db:5432/flowpilot
      - REDIS_URL=redis://redis:6379/0
      - SERVICE_ROLE=kyc_service
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8300/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  orchestration-service:
    build: .
    env_file: .env
    command: uvicorn app.orchestration_service:app --host 0.0.0.0 --port 8400
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://postgres:oracle@db:5432/flowpilot
      - REDIS_URL=redis://redis:6379/0
      - SERVICE_ROLE=orchestration_service
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8400/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
  
  # ── Database ───────────────────────────────────────────────────────────────
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: oracle
      POSTGRES_DB: flowpilot
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

volumes:
  db_data:
  redis_data:
  uploads_data:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1450"
